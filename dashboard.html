<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project-2 — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="brand">Project-2</div>
    <h1>Dashboard</h1>
    <p class="subtitle">Welcome to your account</p>

    <div class="earnings-grid">
      <div class="earning-item"><p><strong>Today's Earnings</strong></p><p id="todayEarnings">Loading...</p></div>
      <div class="earning-item"><p><strong>Total Earnings</strong></p><p id="totalEarnings">Loading...</p></div>
    </div>
    <p class="message" id="message"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="header.js"></script>
<script>
const todayEarnings = document.getElementById("todayEarnings");
const totalEarnings = document.getElementById("totalEarnings");
const message = document.getElementById("message");

async function loadDashboard() {
  const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
  if (sessionError || !sessionData.session) {
    window.location.href = "index.html";
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("today_earnings, total_earnings")
    .eq("id", sessionData.session.user.id)
    .single();

  if (profileError) {
    message.textContent = "Could not load your earnings.";
    message.style.color = "#b00020";
    todayEarnings.textContent = "—";
    totalEarnings.textContent = "—";
    return;
  }
  todayEarnings.textContent = profile.today_earnings ?? 0;
  totalEarnings.textContent = profile.total_earnings ?? 0;
}
loadDashboard();
</script>
<script>
function toggleSiteMenu(){
  const button=document.querySelector(".menu-toggle");
  const links=document.getElementById("siteMenuLinks");
  if(!button||!links)return;
  const opening=links.hidden;
  links.hidden=!opening;
  button.setAttribute("aria-expanded",String(opening));
  button.textContent=opening?"✕ Close Menu":"☰ Menu";
}
document.addEventListener("click",function(event){
  const menu=document.querySelector(".site-menu");
  const button=document.querySelector(".menu-toggle");
  const links=document.getElementById("siteMenuLinks");
  if(menu&&button&&links&&!menu.contains(event.target)){
    links.hidden=true;
    button.setAttribute("aria-expanded","false");
    button.textContent="☰ Menu";
  }
});
</script>
</body>
</html>
