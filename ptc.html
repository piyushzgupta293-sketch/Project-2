<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project-2 — PTC Ads</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-options.css">
<link rel="stylesheet" href="platform.css">
<style>
.ptc-list{display:grid;gap:14px;margin-top:20px}.ad-card{border:1px solid #ddd;border-radius:10px;padding:16px}.ad-card h2{font-size:18px;margin:0 0 8px}.ad-card p{margin:6px 0;color:#666;font-size:14px}.ad-meta{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-size:14px}.ad-button{width:100%;padding:11px;border:0;border-radius:7px;background:#111;color:#fff;font-weight:600;cursor:pointer}.ad-button:disabled{background:#e2e2e2;color:#777;opacity:1;cursor:not-allowed}.ad-button.watched{background:#e2e2e2;color:#777;border:1px solid #ccc}.timer{font-weight:700;text-align:center;margin:12px 0;min-height:20px}.cooldown{font-weight:600;text-align:center;margin:12px 0;min-height:20px;color:#666}.back{display:inline-block;margin-bottom:18px;color:#111;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main class="auth-page"><section class="auth-card">
<a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Project-2</div><h1>PTC Ads</h1><p class="subtitle">View advertisements and earn rewards.</p>
<div id="ads" class="ptc-list"></div><p class="message" id="message">Loading ad list… If this message stays, the page script may not be running.</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="theme-default.js"></script>
<script src="theme.js"></script>
<script src="supabase.js"></script>
<script src="header.js"></script>
<script src="font-picker.js"></script>
<script>
const adsContainer=document.getElementById("ads"),message=document.getElementById("message");
const activeTimers={};
message.textContent="Connecting to the ad database...";
message.style.color="#555";
window.addEventListener("error",event=>{
  message.textContent="Page script error: "+(event.message||"Unknown JavaScript error");
  message.style.color="#b00020";
});
window.addEventListener("unhandledrejection",event=>{
  const reason=event.reason;
  message.textContent="Page request error: "+(reason&&reason.message?reason.message:String(reason||"Unknown error"));
  message.style.color="#b00020";
});
async function getSession(){const {data,error}=await supabaseClient.auth.getSession();if(error||!data.session){window.location.href="index.html";return null;}return data.session;}

async function loadAds(){
  const session=await getSession();if(!session)return;
  const {data:ads,error}=await supabaseClient.from("ptc_ads").select("id,title,description,url,reward,duration_seconds,cooldown_hours").eq("active",true).order("id",{ascending:true});
  if(error){adsContainer.innerHTML="";message.textContent="Could not load advertisements: "+(error.message||error.details||error.hint||"Unknown Supabase error");message.style.color="#b00020";console.error("PTC ads query failed:",error);return;}
  if(!ads||ads.length===0){message.textContent="No advertisements available right now.";return;}
  window.ptcAds=ads;
  const {data:views,error:viewError}=await supabaseClient.from("ptc_views").select("ad_id,claimed_at,viewed_at,started_at,cancelled_at").eq("user_id",session.user.id).order("claimed_at",{ascending:false,nullsFirst:false});
  if(viewError){adsContainer.innerHTML="";message.textContent="Could not verify your ad history. Please refresh the page or try again shortly; ads are hidden to avoid showing an incorrect Ready status.";message.style.color="#b00020";return;}
  const lastClaim={};
  // Prefer the authoritative claim timestamp first. A user can have older,
  // unclaimed/cancelled attempts for the same ad, so legacy fallback must never
  // override a real claim or make a recently claimed ad look available.
  (views||[]).forEach(v=>{
    if(v.claimed_at){
      const current=new Date(v.claimed_at);
      if(!lastClaim[v.ad_id] || current>lastClaim[v.ad_id])lastClaim[v.ad_id]=current;
    }
  });
  // Compatibility for old successful rows created before claimed_at existed.
  (views||[]).forEach(v=>{
    if(lastClaim[v.ad_id]===undefined && !v.cancelled_at && v.viewed_at){
      lastClaim[v.ad_id]=new Date(v.viewed_at);
    }
  });
  message.textContent="";
  const uniqueAds=[];const seenAds=new Set();
  for(const ad of ads){const fingerprint=[String(ad.title||"").trim().toLowerCase(),String(ad.url||"").trim().replace(/\/$/,"")].join("|");if(seenAds.has(fingerprint))continue;seenAds.add(fingerprint);uniqueAds.push(ad);}
  window.ptcAds=uniqueAds;
  adsContainer.innerHTML=uniqueAds.map((ad,index)=>{
    const last=lastClaim[ad.id];
    const cooldownMs=Number(ad.cooldown_hours||24)*60*60*1000;
    const available=!last||Date.now()-last.getTime()>=cooldownMs;
    const initialTimer=available?"Ready":"✓ Already Watched";
    const buttonText=available?"View Ad":"Already Watched";
    return `<article class="ad-card" id="card-${ad.id}"><h2>${index+1}. ${escapeHtml(ad.title)}</h2><p>${escapeHtml(ad.description||"")}</p><div class="ad-meta"><span>Reward: <strong>${ad.reward}</strong></span><span>Time: <strong>${ad.duration_seconds}s</strong></span></div><div class="timer" id="timer-${ad.id}">${initialTimer}</div><div class="cooldown" id="cooldown-${ad.id}">${available?"":"✓ Already watched — available again soon..."}</div><button class="ad-button ${available?"":"watched"}" id="button-${ad.id}" ${available?"":"disabled"} onclick="startAd(${ad.id})">${buttonText}</button></article>`;
  }).join("");
  uniqueAds.forEach(ad=>{if(lastClaim[ad.id])startCooldownClock(ad,lastClaim[ad.id]);});
}

function startCooldownClock(ad,lastClaim){
  const cooldownMs=Number(ad.cooldown_hours||24)*60*60*1000;
  const cooldown=document.getElementById("cooldown-"+ad.id),button=document.getElementById("button-"+ad.id),timer=document.getElementById("timer-"+ad.id);
  function update(){
    const remaining=cooldownMs-(Date.now()-lastClaim.getTime());
    if(remaining<=0){
      cooldown.textContent="Available again";
      timer.textContent="Ready";
      button.disabled=false;
      button.classList.remove("watched");
      button.textContent="View Ad";
      return;
    }
    const totalSeconds=Math.ceil(remaining/1000);
    const hours=Math.floor(totalSeconds/3600);
    const minutes=Math.floor((totalSeconds%3600)/60);
    const seconds=totalSeconds%60;
    cooldown.textContent="✓ Already watched — available again in "+hours+"h "+String(minutes).padStart(2,"0")+"m "+String(seconds).padStart(2,"0")+"s";
  }
  update();
  const interval=setInterval(()=>{update();if(cooldown.textContent==="Available again")clearInterval(interval);},1000);
}

function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

async function startAd(id){
  const ad=window.ptcAds.find(item=>item.id===id);if(!ad)return;
  const session=await getSession();if(!session)return;
  const button=document.getElementById("button-"+id),timer=document.getElementById("timer-"+id);
  button.disabled=true;button.textContent="Starting...";
  const {data:duration,error}=await supabaseClient.rpc("start_ptc_ad",{p_ad_id:id});
  if(error){
    const errorText=error.message||"Could not start the advertisement.";
    message.textContent=errorText;message.style.color="#b00020";
    if(/already viewed|in progress|recently/i.test(errorText)){button.disabled=true;button.textContent="Refreshing status...";await loadAds();}
    else{button.disabled=false;button.textContent="View Ad";}
    return;
  }
  window.open(ad.url,"_blank","noopener,noreferrer");
  const seconds=Number(duration||ad.duration_seconds);
  const state={interval:null,startedAt:Date.now(),durationMs:seconds*1000,completed:false};
  activeTimers[id]=state;
  function updateTimer(){
    const elapsed=Date.now()-state.startedAt,left=Math.max(0,state.durationMs-elapsed),remaining=Math.ceil(left/1000);
    if(left<=0){
      clearInterval(state.interval);state.completed=true;timer.textContent="Viewing complete";button.disabled=false;button.textContent="Claim Reward";button.onclick=()=>claimReward(id);
    }else timer.textContent=remaining+" seconds remaining";
  }
  updateTimer();state.interval=setInterval(updateTimer,250);
}

async function resetEarlyAd(id){
  const state=activeTimers[id];if(!state||state.completed)return;
  clearInterval(state.interval);delete activeTimers[id];
  await supabaseClient.rpc("cancel_ptc_ad",{p_ad_id:id});
  const button=document.getElementById("button-"+id),timer=document.getElementById("timer-"+id);
  if(button){button.disabled=false;button.textContent="View Ad";button.onclick=()=>startAd(id);}
  if(timer)timer.textContent="Returned too early — open the ad again";
  message.textContent="You returned before the viewing time was complete. Please open the ad again.";
  message.style.color="#b00020";
}

async function claimReward(id){
  const state=activeTimers[id];if(!state||!state.completed){message.textContent="Finish the timer before claiming.";message.style.color="#b00020";return;}
  const button=document.getElementById("button-"+id),timer=document.getElementById("timer-"+id);
  button.disabled=true;button.textContent="Claiming...";
  const {data,error}=await supabaseClient.rpc("claim_ptc_reward",{p_ad_id:id});
  if(error){button.disabled=false;button.textContent="Claim Reward";message.textContent=error.message||"Could not claim reward.";message.style.color="#b00020";return;}
  delete activeTimers[id];timer.textContent="✓ Already Watched";button.textContent="Already Watched";button.classList.add("watched");button.disabled=true;button.onclick=null;
  message.textContent="Your reward was added to your balance. Refreshing ad status...";message.style.color="#111";
  await loadAds();
  if(window.refreshAccountHeader) window.refreshAccountHeader();
  message.textContent="Your reward was added to your balance.";message.style.color="#111";
}

document.addEventListener("visibilitychange",async()=>{
  if(!document.hidden){
    for(const id in activeTimers){
      const state=activeTimers[id];
      if(!state.completed){
        if(Date.now()-state.startedAt<state.durationMs)await resetEarlyAd(Number(id));
        else{
          state.completed=true;clearInterval(state.interval);
          document.getElementById("timer-"+id).textContent="Viewing complete";
          const button=document.getElementById("button-"+id);button.disabled=false;button.textContent="Claim Reward";button.onclick=()=>claimReward(Number(id));
        }
      }
    }
  }
});
loadAds().catch(error=>{
  console.error("PTC page initialization failed:",error);
  message.textContent="PTC page error: "+(error&&error.message?error.message:String(error));
  message.style.color="#b00020";
});
</script>
</body>
</html>
